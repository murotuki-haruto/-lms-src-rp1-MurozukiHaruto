# update.html

```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
	th:replace="~{/common/layout :: layout(~{::title},~{::body/content()})}">
<head>
<meta charset="UTF-8">
<title>勤怠情報変更｜LMS</title>
</head>
<body>

	<th:block th:if="${session.loginUserDto.role == '0001'}">
		<h2>勤怠管理</h2>
	</th:block>

	<th:block th:if="${session.loginUserDto.role != '0001'}">
		<h2>勤怠管理 <small>( [[${attendanceForm.userName}]] )</small></h2>
		<th:block th:if="${session.loginUserDto.leaveFlg == '1'}">
			<h2><small>途中退校日：${dispLeaveDate}</small></h2>
		</th:block>
	</th:block>

	<!-- 室月 陽翔 - Task.27 -->
	<!-- 入力チェックエラー表示 -->
	<th:block th:object="${attendanceForm}">
		<th:block th:if="${#fields.hasErrors('*')}">
			<ul style="padding-left: 0; list-style: none;">
				<li th:each="err : ${#fields.errors('*')}">
					<span th:text="'* ' + ${err}" class="help-inline error"></span>
				</li>
			</ul>
		</th:block>
	</th:block>

	<div class="row">
		<div class="bs-component col-sm-12">

			<form th:action="@{/attendance/update}" method="post" th:object="${attendanceForm}">
				<table class="table table-hover dataTable no-footer">
					<thead>
						<tr>
							<th class="w140">日付</th>
							<th class="w300">コース内容</th>
							<th style="min-width: 150px;">出勤</th>
							<th style="min-width: 150px;">退勤</th>
							<th class="w80">中抜け時間</th>
							<th class="w70">ステータス</th>
							<th class="w240">備考</th>
						</tr>
					</thead>
					<tbody>
						<th:block th:each="dailyAttendanceForm, stat : *{attendanceList}">
							<tr>
								<th:block>
									<input type="hidden" th:name="|attendanceList[${stat.index}].isToday|" th:value="${dailyAttendanceForm.isToday}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].studentAttendanceId|" th:value="${dailyAttendanceForm.studentAttendanceId}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].trainingDate|" th:value="${dailyAttendanceForm.trainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].dispTrainingDate|" th:value="${dailyAttendanceForm.dispTrainingDate}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].sectionName|" th:value="${dailyAttendanceForm.sectionName}" />
									<input type="hidden" th:name="|attendanceList[${stat.index}].statusDispName|" th:value="${dailyAttendanceForm.statusDispName}" />
								</th:block>
								<td class="w140">[[${dailyAttendanceForm.dispTrainingDate}]]</td>
								<td class="w300">[[${dailyAttendanceForm.sectionName}]]</td>
								
								<!-- 出勤（横並びレイアウト） -->
								<td style="white-space: nowrap;">
									<div style="display: flex; align-items: center; gap: 4px;">

										<!-- 室月 陽翔 - Task.28 -->
										<!-- 定時ボタン -->
										<button type="button" class="btn btn-success regularTime" th:data-index="${stat.index}">定時</button>

										<span th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeHour')} ? 'has-error'">
											<select th:name="|attendanceList[${stat.index}].trainingStartTimeHour|" class="form-control" style="width: 60px; display: inline-block;">
												<option value="">--</option>
												<option th:each="h : ${hourList}" th:value="${h}" th:text="${h}"
													th:selected="${h == dailyAttendanceForm.trainingStartTimeHour}"></option>
											</select>
										</span>
										<span>:</span>
										<span th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingStartTimeMinute')} ? 'has-error'">
											<select th:name="|attendanceList[${stat.index}].trainingStartTimeMinute|" class="form-control" style="width: 60px; display: inline-block;">
												<option value="">--</option>
												<option th:each="m : ${minuteList}" th:value="${m}" th:text="${m}"
													th:selected="${m == dailyAttendanceForm.trainingStartTimeMinute}"></option>
											</select>
										</span>
									</div>
								</td>
								
								<!-- 退勤（横並びレイアウト） -->
								<td style="white-space: nowrap;">
									<div style="display: flex; align-items: center; gap: 4px;">
										<span th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeHour')} ? 'has-error'">
											<select th:name="|attendanceList[${stat.index}].trainingEndTimeHour|" class="form-control" style="width: 60px; display: inline-block;">
												<option value="">--</option>
												<option th:each="h : ${hourList}" th:value="${h}" th:text="${h}"
													th:selected="${h == dailyAttendanceForm.trainingEndTimeHour}"></option>
											</select>
										</span>
										<span>:</span>
										<span th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].trainingEndTimeMinute')} ? 'has-error'">
											<select th:name="|attendanceList[${stat.index}].trainingEndTimeMinute|" class="form-control" style="width: 60px; display: inline-block;">
												<option value="">--</option>
												<option th:each="m : ${minuteList}" th:value="${m}" th:text="${m}"
													th:selected="${m == dailyAttendanceForm.trainingEndTimeMinute}"></option>
											</select>
										</span>
									</div>
								</td>
								
								<td class="w80">
									<span th:classappend="${#fields.hasErrors('attendanceList[' + stat.index + '].blankTime')} ? 'has-error'">
										<select th:name="|attendanceList[${stat.index}].blankTime|" class="form-control">
											<option th:each="blankTime : ${attendanceForm.blankTimes}" th:value="${blankTime.key}" th:inline="text" class="form-control" 
												th:selected="${blankTime.key == dailyAttendanceForm.blankTime}">[[${blankTime.value}]]</option>
										</select>
									</span>
								</td>
								<td class="w70">[[${dailyAttendanceForm.statusDispName}]]</td>
								<td class="w240">
									<input type="text" th:name="|attendanceList[${stat.index}].note|" th:value="${dailyAttendanceForm.note}" class="form-control" />
								</td>
							</tr>
						</th:block>
					</tbody>
				</table>

				<div class="form-group">
					<th:block th:if="${session.loginUserDto.role == '0001'}">
						<a th:href="@{/attendance/detail}" class="btn btn-default">戻る</a>
					</th:block>
					<th:block th:if="${session.loginUserDto.role != '0001'}">
						<input type="submit" value="戻る" name="indexCompany" class="btn btn-default" />
					</th:block>
					<input type="submit" value="更新" name="complete" class="btn btn-info" />
				</div>

			</form>
		</div>
	</div>

	<!-- 室月 陽翔 - Task.27 -->
	<!-- 更新確認ダイアログ -->
	<script type="text/javascript">
		$(function() {

			$("input[name='complete']").click(function() {

				return confirm("更新します。よろしいですか？");

			});

		});
	</script>

	<!-- 室月 陽翔 - Task.28 -->
	<!-- 定時ボタン押下 -->
	<script type="text/javascript">
		$(function() {

			$(".regularTime").click(function() {

				var index = $(this).data("index");

				$("select[name='attendanceList[" + index + "].trainingStartTimeHour']").val("09");
				$("select[name='attendanceList[" + index + "].trainingStartTimeMinute']").val("00");

				$("select[name='attendanceList[" + index + "].trainingEndTimeHour']").val("18");
				$("select[name='attendanceList[" + index + "].trainingEndTimeMinute']").val("00");

			});

		});
	</script>

</body>
</html>
```
